:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2a30;--mute:#5d6b70;--line:#dbe2df;--acc:#1f6f78;--accs:#e3f1f2;--ok:#2e7d4f;--oks:#e5f3ea;--bad:#b3452c;--bads:#fbe8e2;--warn:#a86400;--warns:#fff1d6;color-scheme:light}
*{box-sizing:border-box;font-feature-settings:"locl" 0,"tnum" 0,"lnum" 1}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DDNSarabun',Tahoma,sans-serif;font-size:20px;line-height:1.45}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.danger{color:var(--bad);border-color:var(--bads)}
input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{width:44px;height:44px}.top h1{font-size:24px;margin:0;line-height:1.2}.top .sub{font-size:16px;color:var(--mute)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.steps button{border-radius:999px;padding:4px 14px;font-size:18px}.steps button[aria-current=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.steps .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accs);color:var(--acc);font-size:14px;margin-right:6px;font-weight:700}
.steps button[aria-current=true] .n{background:#fff}
.sync{font-size:15px;border-radius:999px;padding:0 10px;white-space:nowrap;display:none;margin-left:6px;vertical-align:middle}
.sync.on{display:inline-block}.sync.busy{background:var(--accs);color:var(--acc)}.sync.ok{background:var(--oks);color:var(--ok)}.sync.bad{background:var(--bads);color:var(--bad)}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.card h2{font-size:22px;margin:0}.muted{color:var(--mute);font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.stat b{font-size:28px;display:block;line-height:1.2}.stat span{font-size:16px;color:var(--mute)}
.stat.ok{background:var(--oks);border-color:#bfe0cb}.stat.warn{background:var(--warns);border-color:#f0d49a}
.hint{border-radius:10px;padding:10px 14px;background:var(--accs);font-size:18px}.hint.warn{background:var(--warns)}.hint.bad{background:var(--bads);color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bar{border-radius:10px;padding:8px 12px;border:1px solid var(--line)}.bar .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.bar .track{height:10px;border-radius:5px;background:#e8ecea;margin-top:6px;overflow:hidden}.bar .fill{height:100%;border-radius:5px;transition:width .25s}
.bar small{color:var(--mute);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 10px;font-size:15px;border:1px solid transparent;white-space:nowrap;line-height:1.7}
.chip.sel{font-weight:700;box-shadow:inset 0 0 0 2px currentColor}
.fil button{border-radius:999px;padding:2px 12px;font-size:16px}.fil button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb{display:contents}
.list{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.it{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,2fr) minmax(150px,auto);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);text-align:left;border-radius:0;border-left:0;border-right:0;border-bottom:0;background:var(--card);width:100%;content-visibility:auto;contain-intrinsic-size:auto 66px}
.it:first-child{border-top:0}.it:hover{background:#f8faf9}
.it.pend{background:var(--warns)}.it.self{box-shadow:inset 4px 0 0 #9aa4ad}.wt{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2.4fr);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}.wt:first-child{border-top:0}.wt .nm b{display:block;font-weight:700}.wt .nm span{font-size:15px;color:var(--mute)}.wt button{padding:4px 10px;font-size:17px}.it .no{color:var(--mute);font-size:16px}
.it .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .nm span{font-size:15px;color:var(--mute)}
.it .pf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:620px}.it .pf .chip{justify-content:center;overflow:hidden;text-overflow:ellipsis}.it .pf .chip.none{background:transparent;border:1px dashed var(--line);color:var(--mute)}.it.red{box-shadow:inset 4px 0 0 #E06666}.it .st{text-align:right;font-size:16px}
.st .s{font-weight:700;border-radius:8px;padding:0 10px;display:inline-block}.st small{display:block;color:var(--mute);font-size:14px}
.badge{border-radius:6px;padding:0 8px;font-size:15px;font-weight:700}
.b-lock{background:#D9F2E0;color:#1e6b3b}.b-gen{background:#D0E8F5;color:#154f75}.b-rsrv{background:#FFF2CC;color:#7a5a00}.b-odd{background:#eee;color:#555}
.b-pend{background:var(--warns);color:var(--warn)}.b-pick{background:#fbd6d6;color:#9b2c2c}.b-none{background:#e4e7ea;color:#4a5560}
table{border-collapse:collapse;width:100%;font-size:18px}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button{border-radius:8px 8px 0 0;font-size:17px}
.log{font-size:16px}.log td{text-align:left;vertical-align:top}
.empty{padding:24px;text-align:center;color:var(--mute)}
.spin{width:22px;height:22px;border:3px solid var(--accs);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:18px;max-width:min(92vw,720px);display:none;z-index:60}
#toast.bad{background:var(--bad)}
.fil.sticky{position:sticky;top:var(--hh,72px);z-index:4;background:var(--card);margin:-14px -16px 0;padding:10px 16px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 4px 8px -6px rgba(0,0,0,.15)}
#totop{position:fixed;right:16px;bottom:18px;z-index:40;border-radius:999px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);box-shadow:0 12px 40px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(0,0,0,.25)}
.dl{padding:16px 18px;display:grid;gap:12px}.dl h3{margin:0;font-size:24px}
.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.scores div{border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px}.scores span{display:block;font-size:14px;color:var(--mute)}.scores b{font-size:22px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.pick button{text-align:left;padding:8px 12px;border-width:2px}.pick button small{display:block;font-size:14px;color:var(--mute)}
.pick button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.login{max-width:520px;margin:40px auto 0;width:100%}.login input[type=password],.login input[type=url]{flex:1;min-width:0}.err{color:var(--bad);font-size:17px;min-height:1.4em}
details summary{cursor:pointer;color:var(--mute);font-size:16px}
.hide{display:none!important}
@media (max-width:760px){
 body{font-size:18px}.top{flex-wrap:wrap}.top h1{font-size:20px}.steps{margin-left:0;width:100%}.steps button{font-size:16px;padding:3px 10px}
 main{padding:10px}.it{grid-template-columns:40px minmax(0,1fr) auto;contain-intrinsic-size:auto 118px}.it .pf{grid-column:2/4;order:3;grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:1fr 1fr}
 .scores{grid-template-columns:repeat(3,1fr)}.hide-m{display:none}
 .wt{grid-template-columns:1fr;gap:6px} .bars{grid-template-columns:1fr 1fr;gap:6px}.bar .track{height:7px;margin-top:4px}.bar small{display:none}
 .fil.sticky{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.fil.sticky>*,.fil.sticky .fb>*{flex:none}.fil.sticky input{min-width:170px}.fil.sticky .muted{display:none}.bar{padding:6px 10px}.bar .t{flex-direction:column;gap:0;font-size:16px}
}

.dtabs{display:flex;flex-wrap:wrap;gap:6px}.dtabs button{border-radius:999px;font-size:17px;padding:3px 14px}.dtabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:6px;align-content:start}.doc b{font-size:19px}.doc .muted{font-size:16px}

.rooms td,.rooms th{font-size:17px;padding:4px 8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 14px}
.fgrid label{display:grid;gap:2px;font-size:16px;color:var(--mute)}.fgrid input,.fgrid select{width:100%;color:var(--ink)}
select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
.nextr{border:2px solid var(--acc);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--accs)}
.nextr .big{font-size:24px;font-weight:700}
.tel a{display:inline-block;margin:2px 8px 2px 0;padding:2px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--acc);text-decoration:none;font-weight:700}
.wl .it{grid-template-columns:52px minmax(0,1.6fr) minmax(0,1fr) auto}
.b-w{background:#fbd6d6;color:#9b2c2c}.b-a{background:#D9F2E0;color:#1e6b3b}.b-d{background:#eceff1;color:#455a64}.b-n{background:var(--warns);color:var(--warn)}
.rtab td,.rtab th{font-size:16px;padding:4px 8px}.rtab td:nth-child(3){text-align:left}
#prv{position:fixed;inset:0;z-index:55;background:#dfe4e2;overflow:auto;display:none}
#prv.on{display:block}
#prv .pbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08)}
#prv .pbar b{font-size:20px}#prv .pbar .muted{font-size:15px}

  @page{size:A4;margin:0}

<script>window.__BOOT__=/*BOOT*/null;</script>
<script>
/* ===== TE: แกนคำนวณระบบจัดสาย ม.4 — โค้ดชุดเดียวกันทั้งเซิร์ฟเวอร์ (Apps Script) และหน้าเว็บ =====
   แถวรายชื่อหลัก: 0 ลำดับ, 1 เลขที่สมัคร, 2-4 ชื่อ, 5 ประเภท F, 6 ประเภท G, 7-10 อันดับ 1-4, 11-15 S1-S5, 16 รวม, 17 T,
                   18 สายที่จัด, 19 การเลือก, 20 คนที่, 21 ครูจัดให้ (0/1 = เซลล์ B แดง: ระบบไม่จัดอัตโนมัติ ครูเลือกสายเอง)
   แถวคัดเลือก:   0-17 เหมือนกัน, 18 สถานะ, 19 ครูจัดให้ (0/1 = เซลล์ B แดง) */
var TE = (function () {
  'use strict';
  var PEND = 'รอพิจารณา', TEACH = 'ครูจัดให้', UNDO_MAX = 5;

  function str(v) { return String(v == null ? '' : v).trim(); }
  function num(v) { return parseFloat(v) || 0; }
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function fail(m) { var e = new Error(m); e.user = true; throw e; }
  function byKeys(keys) {
    return function (a, b) { for (var i = 0; i < keys.length; i++) { var d = num(b[keys[i]]) - num(a[keys[i]]); if (d) return d; } return 0; };
  }
  function cloneRows(rows) { return rows.map(function (r) { return r.slice(); }); }
  function isPend(r) { return str(r[18]) === PEND; }
  function name(r) { return str(r[2]) + str(r[3]) + ' ' + str(r[4]); }

  function counts(rows, cfg) {
    var c = {};
    cfg.streams.forEach(function (s) { c[s] = 0; });
    (rows || []).forEach(function (r) { var v = str(r[18]); if (has(c, v)) c[v]++; });
    return c;
  }
  function full(list, c, q) { return list.every(function (s) { return c[s] >= q[s]; }); }

  /* ---------- คัดเลือกผู้เข้าสอบ (เหมือน sortCandidates_M4 + runSelection_M4) ---------- */
  function norm(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
  // กลุ่มสำหรับเรียง/ส่ง: B แดง → R, ม.3 เดิม+ทั่วไป → A, ทั่วไป+ความสามารถพิเศษ → B, อื่นๆ → C (เทียบตรงตัวแบบเมนูเดิม)
  function grp(r, cfg) {
    if (r[19]) return 'R';
    var f = str(r[5]), g = str(r[6]);
    if (f === cfg.m3 && g === cfg.tg) return 'A';
    if (f === cfg.tg && g === cfg.ts) return 'B';
    return 'C';
  }
  function known(r, cfg) { // ประเภทสะกดตรงแบบ (ใช้เตือนครู)
    var f = str(r[5]), g = str(r[6]);
    return (f === cfg.m3 && g === cfg.tg) || (f === cfg.tg && (g === cfg.tg || g === cfg.ts));
  }
  function byGroup(rows, cfg) {
    var G = { A: [], B: [], R: [], C: [] }, k = byKeys(cfg.selKeys);
    rows.forEach(function (r) { G[grp(r, cfg)].push(r); });
    return G.A.sort(k).concat(G.B.sort(k), G.R.sort(k), G.C.sort(k));
  }
  function selSort(rows, cfg) {
    var out = byGroup(rows, cfg);
    out.forEach(function (r, i) { r[0] = i + 1; });
    return out;
  }
  // ชนิดตอนคัดเลือก (เหมือน runSelection_M4 ซึ่งยอมรับคำที่มี "เดิม"/"พิเศษ" และเว้นวรรคเกิน): R ครูจัดให้, A ม.3 เดิม, B ทั่วไป+พิเศษ, C ทั่วไป
  function kind(r, cfg) {
    if (r[19]) return 'R';
    var f = norm(r[5]), g = norm(r[6]);
    if (f === cfg.m3 || f.indexOf('เดิม') >= 0) return 'A';
    if (f === cfg.tg && (g === cfg.ts || g.indexOf('พิเศษ') >= 0)) return 'B';
    return 'C';
  }
  // ไล่ตามลำดับที่เรียงแล้ว: ยังไม่เต็มโควต้า → R/A/B = ตัวจริงล็อค, C = ตัวจริงทั่วไป · เต็มแล้ว → สำรอง
  function selStatus(rows, quota, cfg) {
    var L = cfg.stl, real = 0;
    return rows.map(function (r) { if (real < quota) { real++; return kind(r, cfg) === 'C' ? L[1] : L[0]; } return L[2]; });
  }
  function selCount(rows, cfg) {
    var L = cfg.stl, o = { A: 0, B: 0, R: 0, C: 0, lock: 0, gen: 0, rsrv: 0, rsrvR: 0 };
    rows.forEach(function (r) {
      var s = str(r[18]), k = kind(r, cfg);
      if (s === L[0] || s === L[1]) { o[k]++; if (s === L[0]) o.lock++; else o.gen++; }
      else if (s === L[2]) { o.rsrv++; if (k === 'R') o.rsrvR++; }
    });
    return o;
  }
  function reselect(rows, quota, cfg) {
    rows = selSort(rows, cfg);
    var ss = selStatus(rows, quota, cfg);
    rows.forEach(function (x, j) { x[18] = ss[j]; });
    return rows;
  }
  function selSummary(rows, cfg) {
    var n = selCount(rows, cfg);
    return 'ตัวจริง ' + (n.lock + n.gen) + ' คน (ล็อค: ม.3 เดิม ' + n.A + ' · ความสามารถพิเศษ ' + n.B + ' · ครูจัดให้ ' + n.R + ' | ทั่วไป ' + n.gen + ') · สำรอง ' + n.rsrv + ' คน' +
      (n.rsrvR ? ' — ครูจัดให้เกินโควต้า ' + n.rsrvR + ' คน' : '');
  }
  function findSel(rows, id) {
    var k = str(id);
    for (var i = 0; i < rows.length; i++) if (str(rows[i][1]) === k) return i;
    fail('ไม่พบเลขที่สมัคร ' + id + ' ในแท็บคัดเลือก');
  }

  /* ---------- จัดสาย (เหมือน _sortUnassigned + autoAssignSci + autoAssignArt) ---------- */
  function sortMain(rows, mode, cfg) {
    var a = [], n = [], p = [];
    rows.forEach(function (r) { if (str(r[18]) !== '') a.push(r); else if (manual(r, cfg)) p.push(r); else n.push(r); });
    n.sort(byKeys(mode === 'sci' ? cfg.sciKeys : cfg.artKeys));
    p.sort(byKeys(cfg.artKeys));
    var out = a.concat(n, p);
    out.forEach(function (r, i) { r[0] = i + 1; });
    return out;
  }
  // อันดับที่เลือกซึ่งเป็นสายจริง (ตัดช่องว่าง, "-", และคำที่สะกดนอกระบบทิ้ง)
  function prefsOf(r, cfg) {
    var o = [];
    for (var k = 0; k < 4; k++) { var p = str(r[7 + k]); if (p && p !== '-' && cfg.streams.indexOf(p) >= 0) o.push(p); }
    return o;
  }
  function noPref(r, cfg) { return prefsOf(r, cfg).length === 0; }
  // โรงเรียนจัดให้ = ระบบไม่จัดสายอัตโนมัติ ครูเลือกเอง · 2 กรณี: ครูทำเครื่องหมายเอง (เซลล์ B แดง) หรือ ไม่ได้เลือกอันดับเลย (ไม่มีสิทธิ์เลือกแผน)
  function manual(r, cfg) { return !!r[21] || noPref(r, cfg); }
  function why(r, cfg) { return r[21] ? TEACH : 'ไม่ได้เลือกอันดับ'; }
  function todo(rows, cfg) { return rows.filter(function (r) { return !str(r[18]) && !manual(r, cfg); }).length; } // ยังไม่จัด (ไม่นับกลุ่มโรงเรียนจัดให้)
  function waiting(rows, cfg) { return rows.filter(function (r) { return !str(r[18]) && manual(r, cfg); }).length; } // กลุ่มโรงเรียนจัดให้ที่ยังไม่ได้สาย
  function waitMsg(rows, cfg) { var w = waiting(rows, cfg); return w ? ' · รอครูเลือกสายให้อีก ' + w + ' คน (โรงเรียนจัดให้)' : ''; }
  function place(r, s, k, c) { c[s]++; r[18] = s; r[19] = 'อันดับ ' + (k + 1); r[20] = 'คนที่ ' + c[s]; }
  function hold(r) { r[18] = PEND; r[19] = ''; r[20] = ''; }
  function runSci(rows, q, cfg) {
    var c = counts(rows, cfg), isS = {}, isA = {}, stopSeq = -1;
    cfg.streams.forEach(function (s) { isS[s] = 1; }); cfg.art.forEach(function (s) { isA[s] = 1; });
    var order = rows.map(function (_, i) { return i; }).sort(function (a, b) { return num(rows[b][17]) - num(rows[a][17]); });
    outer:
    for (var k = 0; k < order.length; k++) {
      var idx = order[k], r = rows[idx];
      if (full(cfg.sci, c, q)) { stopSeq = +r[0]; break; }
      if (str(r[18]) || manual(r, cfg)) continue; // จัดแล้ว หรือ โรงเรียนจัดให้ (ครูเลือกสายเอง) → ข้าม
      var placed = false, stop = false;
      for (var pi = 0; pi < 4; pi++) {
        var p = str(r[7 + pi]);
        if (!p || p === '-' || !has(isS, p)) continue;
        if (c[p] < q[p]) { place(r, p, pi, c); placed = true; break; }
        if (has(isA, p)) { hold(r); if (stopSeq < 0) stopSeq = +r[0]; stop = true; break; }
      }
      if (stop) break outer;
      if (!placed) { hold(r); if (stopSeq < 0) stopSeq = +r[0]; break; }
    }
    return { stopSeq: stopSeq };
  }
  function runArt(rows, q, cfg) {
    var c = counts(rows, cfg), isA = {}, assigned = 0;
    cfg.art.forEach(function (s) { isA[s] = 1; });
    for (var i = 0; i < rows.length; i++) {
      if (full(cfg.art, c, q)) break;
      var r = rows[i];
      if (str(r[18]) || manual(r, cfg)) continue; // จัดแล้ว หรือ โรงเรียนจัดให้ → ข้าม
      var placed = false;
      for (var pi = 0; pi < 4; pi++) {
        var p = str(r[7 + pi]);
        if (!p || p === '-' || !has(isA, p)) continue;
        if (c[p] < q[p]) { place(r, p, pi, c); placed = true; assigned++; break; }
      }
      if (!placed) { hold(r); break; }
    }
    return { assigned: assigned };
  }

  /* ---------- ภาพจำสำหรับย้อนกลับ (เก็บเฉพาะคนที่มีสาย เข้ารหัสสั้น) ---------- */
  function enc3(s, t, u, cfg) {
    var si = cfg.streams.indexOf(s), m = /^อันดับ (\d)$/.exec(t), n = /^คนที่ (\d+)$/.exec(u);
    return [si >= 0 ? si : s === '' ? -1 : s === PEND ? -2 : s,
      t === '' ? 0 : m && +m[1] > 0 ? +m[1] : t === TEACH ? 9 : t,
      u === '' ? 0 : n && +n[1] > 0 ? +n[1] : u];
  }
  function dec3(x, cfg) {
    var a = x[0], b = x[1], c = x[2];
    return [typeof a === 'number' ? (a >= 0 ? cfg.streams[a] : a === -2 ? PEND : '') : a,
      typeof b === 'number' ? (b === 0 ? '' : b === 9 ? TEACH : 'อันดับ ' + b) : b,
      typeof c === 'number' ? (c === 0 ? '' : 'คนที่ ' + c) : c];
  }
  function snapOf(rows, cfg) {
    var d = {};
    rows.forEach(function (r) { var s = str(r[18]), t = str(r[19]), u = str(r[20]); if (s || t || u) d[str(r[1])] = enc3(s, t, u, cfg); });
    return d;
  }

  /* ---------- ลายนิ้วมือข้อมูล: ใช้ตรวจว่าหน้าเว็บกับชีตตรงกัน ---------- */
  function cyrb(s) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0, ch; i < s.length; i++) { ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  function canon(v) { return typeof v === 'number' ? String(v) : str(v); }
  function hashMain(st, cfg) {
    var a = [];
    (st.main || []).forEach(function (r) { for (var j = 0; j < 21; j++) a.push(canon(r[j])); a.push(r[21] ? '1' : '0'); });
    a.push(cfg.streams.map(function (s) { return st.q[s]; }).join(','), String(st.un || 0), str(st.ul));
    return cyrb(a.join('\u001f'));
  }
  function hashSel(st) {
    var a = [];
    (st.sel || []).forEach(function (r) { for (var j = 0; j < 19; j++) a.push(canon(r[j])); a.push(r[19] ? '1' : '0'); });
    a.push(String(st.qSel || 0));
    return cyrb(a.join('\u001f'));
  }

  /* ---------- บีบข้อมูลตารางก่อนส่ง (แยกคอลัมน์ + พจนานุกรมข้อความใช้ร่วม) ---------- */
  function pack(tables) {
    var dict = [], map = {}, t = {};
    var id = function (v) { var k = typeof v + '\u0000' + v; if (!has(map, k)) { map[k] = dict.length; dict.push(v); } return map[k]; };
    Object.keys(tables).forEach(function (name) {
      var rows = tables[name].rows || [], w = tables[name].w, cols = [];
      for (var j = 0; j < w; j++) {
        var allNum = true;
        for (var i = 0; i < rows.length; i++) if (typeof rows[i][j] !== 'number') { allNum = false; break; }
        var col = new Array(rows.length);
        for (i = 0; i < rows.length; i++) col[i] = allNum ? rows[i][j] : id(rows[i][j] == null ? '' : rows[i][j]);
        cols.push(allNum ? col : { i: col });
      }
      t[name] = { n: rows.length, c: cols };
    });
    return { d: dict, t: t };
  }
  function unpack(p, name) {
    var T = p.t[name], rows = [];
    if (!T) return rows;
    for (var i = 0; i < T.n; i++) {
      var r = new Array(T.c.length);
      for (var j = 0; j < T.c.length; j++) { var c = T.c[j]; r[j] = Array.isArray(c) ? c[i] : p.d[c.i[i]]; }
      rows.push(r);
    }
    return rows;
  }

  /* ---------- คำสั่งทั้งหมด: รับสถานะเดิม → คืนสถานะใหม่ (ไม่แก้ของเดิม) ---------- */
  function needMain(st) { if (!st.main || !st.main.length) fail('ยังไม่มีรายชื่อในแท็บ "รายชื่อหลัก" — ส่งตัวจริงจากขั้นที่ 1 ก่อน'); }
  function findIdx(rows, id) {
    var k = str(id);
    for (var i = 0; i < rows.length; i++) if (str(rows[i][1]) === k) return i;
    fail('ไม่พบเลขที่สมัคร ' + id + ' ในรายชื่อหลัก');
  }
  function sMap(rows) { var m = {}; rows.forEach(function (r) { m[str(r[1])] = str(r[18]); }); return m; }
  function newlyPlaced(rows, before) {
    var o = [];
    rows.forEach(function (r, i) { var s = str(r[18]); if (s && s !== PEND && s !== before[str(r[1])]) o.push(i); });
    return o;
  }

  function run(st0, op, cfg, env) {
    var st = {}, k;
    for (k in st0) if (has(st0, k)) st[k] = st0[k];
    var a = op.a, p = op.p || {}, out = { st: st, msg: '', main: false, order: false, sel: false, push: null, pop: false, clearUndo: false, quotas: false, rows: null, changed: [], log: null, server: false };
    var rows, c, pend, before, res, i, r;
    switch (a) {
      case 'select': {
        var qt = parseInt(p.quota, 10);
        if (!(qt > 0)) fail('กรอกโควต้าตัวจริงทั้งหมดเป็นตัวเลขมากกว่า 0');
        if (!st.sel || !st.sel.length) fail('ยังไม่มีรายชื่อผู้สมัครในแท็บ "คัดเลือกผู้เข้าสอบ"');
        st.sel = reselect(cloneRows(st.sel), qt, cfg); st.qSel = qt;
        st.selInfo = { at: env.now, quota: qt };
        out.sel = out.order = true;
        out.msg = 'คัดเลือกเสร็จ: ' + selSummary(st.sel, cfg);
        out.log = ['คัดเลือก (เว็บ)', 'โควต้า ' + qt + ' | ' + selSummary(st.sel, cfg)];
        break;
      }
      case 'selPick': {
        if (!st.sel || !st.sel.length) fail('ยังไม่มีรายชื่อผู้สมัครในแท็บ "คัดเลือกผู้เข้าสอบ"');
        i = findSel(st.sel, p.id);
        var on1 = p.on ? 1 : 0, nm1 = name(st.sel[i]);
        if ((st.sel[i][19] ? 1 : 0) === on1) { out.msg = 'ไม่มีการเปลี่ยนแปลง'; out.noop = true; break; }
        rows = st.sel.slice(); r = rows[i].slice(); r[19] = on1; rows[i] = r;
        out.sel = true; out.rows = [i];
        if (rows.some(function (x) { return str(x[18]); }) && st.qSel > 0) { // คัดเลือกไปแล้ว → คัดใหม่ทันทีด้วยโควต้าเดิม
          rows = reselect(cloneRows(rows), st.qSel, cfg); out.order = true;
          st.selInfo = { at: env.now, quota: st.qSel };
          out.msg = (on1 ? 'ครูจัดให้: ' : 'ยกเลิกครูจัดให้: ') + nm1 + ' → คัดเลือกใหม่แล้ว · ' + selSummary(rows, cfg);
        } else out.msg = (on1 ? 'ทำเครื่องหมายครูจัดให้: ' : 'ยกเลิกครูจัดให้: ') + nm1 + ' (มีผลเมื่อกดคัดเลือก)';
        st.sel = rows;
        out.log = ['ครูจัดให้ · คัดเลือก (เว็บ)', (on1 ? 'ทำเครื่องหมาย ' : 'ยกเลิกเครื่องหมาย ') + nm1 + (out.order ? ' | คัดเลือกใหม่: ' + selSummary(rows, cfg) : '')];
        break;
      }
      case 'send': {
        var real = (st.sel || []).filter(function (x) { var s = str(x[18]); return s === cfg.stl[0] || s === cfg.stl[1]; });
        if (!real.length) fail('ยังไม่มีตัวจริง กรุณากดคัดเลือกก่อน');
        var ord = byGroup(real, cfg), gc = { A: 0, B: 0, R: 0, C: 0 };
        ord.forEach(function (x) { gc[grp(x, cfg)]++; });
        st.main = ord.map(function (x, j) { var y = x.slice(0, 18); y[0] = j + 1; y.push('', '', '', x[19] ? 1 : 0); return y; });
        st.un = 0; st.ul = ''; st.dirty = true;
        out.main = out.order = out.clearUndo = true;
        out.msg = 'ส่งตัวจริง ' + st.main.length + ' คนไปจัดสายแล้ว';
        out.log = ['ส่งตัวจริงไปรายชื่อหลัก (เว็บ)', 'ส่ง ' + st.main.length + ' คน (A ' + gc.A + ' | B ' + gc.B + ' | ครูจัดให้ ' + gc.R + ' | C ' + gc.C + ') เริ่มจัดสายใหม่'];
        break;
      }
      case 'assignSci': {
        needMain(st);
        if (full(cfg.sci, counts(st.main, cfg), st.q)) { out.msg = 'สายวิทย์ทั้งหมดเต็มแล้ว — กดจัดสายศิลป์ต่อได้เลย'; out.noop = true; break; }

});
