:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2a30;--mute:#5d6b70;--line:#dbe2df;--acc:#1f6f78;--accs:#e3f1f2;--ok:#2e7d4f;--oks:#e5f3ea;--bad:#b3452c;--bads:#fbe8e2;--warn:#a86400;--warns:#fff1d6;color-scheme:light}
*{box-sizing:border-box;font-feature-settings:"locl" 0,"tnum" 0,"lnum" 1}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DDNSarabun',Tahoma,sans-serif;font-size:20px;line-height:1.45}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.danger{color:var(--bad);border-color:var(--bads)}
input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{width:44px;height:44px}.top h1{font-size:24px;margin:0;line-height:1.2}.top .sub{font-size:16px;color:var(--mute)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.steps button{border-radius:999px;padding:4px 14px;font-size:18px}.steps button[aria-current=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.steps .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accs);color:var(--acc);font-size:14px;margin-right:6px;font-weight:700}
.steps button[aria-current=true] .n{background:#fff}
.sync{font-size:15px;border-radius:999px;padding:0 10px;white-space:nowrap;display:none;margin-left:6px;vertical-align:middle}
.sync.on{display:inline-block}.sync.busy{background:var(--accs);color:var(--acc)}.sync.ok{background:var(--oks);color:var(--ok)}.sync.bad{background:var(--bads);color:var(--bad)}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.card h2{font-size:22px;margin:0}.muted{color:var(--mute);font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.stat b{font-size:28px;display:block;line-height:1.2}.stat span{font-size:16px;color:var(--mute)}
.stat.ok{background:var(--oks);border-color:#bfe0cb}.stat.warn{background:var(--warns);border-color:#f0d49a}
.hint{border-radius:10px;padding:10px 14px;background:var(--accs);font-size:18px}.hint.warn{background:var(--warns)}.hint.bad{background:var(--bads);color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.bar{border-radius:10px;padding:8px 12px;border:1px solid var(--line)}.bar .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.bar .track{height:10px;border-radius:5px;background:#e8ecea;margin-top:6px;overflow:hidden}.bar .fill{height:100%;border-radius:5px;transition:width .25s}
.bar small{color:var(--mute);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 10px;font-size:15px;border:1px solid transparent;white-space:nowrap;line-height:1.7}
.chip.sel{font-weight:700;box-shadow:inset 0 0 0 2px currentColor}
.fil button{border-radius:999px;padding:2px 12px;font-size:16px}.fil button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb{display:contents}
.list{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.it{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,2fr) minmax(150px,auto);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);text-align:left;border-radius:0;border-left:0;border-right:0;border-bottom:0;background:var(--card);width:100%;content-visibility:auto;contain-intrinsic-size:auto 66px}
.it:first-child{border-top:0}.it:hover{background:#f8faf9}
.it.pend{background:var(--warns)}.it.self{box-shadow:inset 4px 0 0 #9aa4ad}.wt{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2.4fr);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}.wt:first-child{border-top:0}.wt .nm b{display:block;font-weight:700}.wt .nm span{font-size:15px;color:var(--mute)}.wt button{padding:4px 10px;font-size:17px}.it .no{color:var(--mute);font-size:16px}
.it .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .nm span{font-size:15px;color:var(--mute)}
.it .pf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:620px}.it .pf .chip{justify-content:center;overflow:hidden;text-overflow:ellipsis}.it .pf .chip.none{background:transparent;border:1px dashed var(--line);color:var(--mute)}.it.red{box-shadow:inset 4px 0 0 #E06666}.it .st{text-align:right;font-size:16px}
.st .s{font-weight:700;border-radius:8px;padding:0 10px;display:inline-block}.st small{display:block;color:var(--mute);font-size:14px}
.badge{border-radius:6px;padding:0 8px;font-size:15px;font-weight:700}
.b-lock{background:#D9F2E0;color:#1e6b3b}.b-gen{background:#D0E8F5;color:#154f75}.b-rsrv{background:#FFF2CC;color:#7a5a00}.b-odd{background:#eee;color:#555}
.b-pend{background:var(--warns);color:var(--warn)}.b-pick{background:#fbd6d6;color:#9b2c2c}.b-none{background:#e4e7ea;color:#4a5560}
table{border-collapse:collapse;width:100%;font-size:18px}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button{border-radius:8px 8px 0 0;font-size:17px}
.log{font-size:16px}.log td{text-align:left;vertical-align:top}
.empty{padding:24px;text-align:center;color:var(--mute)}
.spin{width:22px;height:22px;border:3px solid var(--accs);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:18px;max-width:min(92vw,720px);display:none;z-index:60}
#toast.bad{background:var(--bad)}
.fil.sticky{position:sticky;top:var(--hh,72px);z-index:4;background:var(--card);margin:-14px -16px 0;padding:10px 16px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 4px 8px -6px rgba(0,0,0,.15)}
#totop{position:fixed;right:16px;bottom:18px;z-index:40;border-radius:999px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);box-shadow:0 12px 40px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(0,0,0,.25)}
.dl{padding:16px 18px;display:grid;gap:12px}.dl h3{margin:0;font-size:24px}
.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.scores div{border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px}.scores span{display:block;font-size:14px;color:var(--mute)}.scores b{font-size:22px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.pick button{text-align:left;padding:8px 12px;border-width:2px}.pick button small{display:block;font-size:14px;color:var(--mute)}
.pick button.cur{box-shadow:inset 0 0 0 2px var(--ink)}
.login{max-width:520px;margin:40px auto 0;width:100%}.login input[type=password],.login input[type=url]{flex:1;min-width:0}.err{color:var(--bad);font-size:17px;min-height:1.4em}
details summary{cursor:pointer;color:var(--mute);font-size:16px}
.hide{display:none!important}
@media (max-width:760px){
 body{font-size:18px}.top{flex-wrap:wrap}.top h1{font-size:20px}.steps{margin-left:0;width:100%}.steps button{font-size:16px;padding:3px 10px}
 main{padding:10px}.it{grid-template-columns:40px minmax(0,1fr) auto;contain-intrinsic-size:auto 118px}.it .pf{grid-column:2/4;order:3;grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:1fr 1fr}
 .scores{grid-template-columns:repeat(3,1fr)}.hide-m{display:none}
 .wt{grid-template-columns:1fr;gap:6px} .bars{grid-template-columns:1fr 1fr;gap:6px}.bar .track{height:7px;margin-top:4px}.bar small{display:none}
 .fil.sticky{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.fil.sticky>*,.fil.sticky .fb>*{flex:none}.fil.sticky input{min-width:170px}.fil.sticky .muted{display:none}.bar{padding:6px 10px}.bar .t{flex-direction:column;gap:0;font-size:16px}
}
</style></head><body>

<script>
/* ===== TE: แกนคำนวณระบบจัดสาย ม.4 — โค้ดชุดเดียวกันทั้งเซิร์ฟเวอร์ (Apps Script) และหน้าเว็บ =====
   แถวรายชื่อหลัก: 0 ลำดับ, 1 เลขที่สมัคร, 2-4 ชื่อ, 5 ประเภท F, 6 ประเภท G, 7-10 อันดับ 1-4, 11-15 S1-S5, 16 รวม, 17 T,
                   18 สายที่จัด, 19 การเลือก, 20 คนที่, 21 ครูจัดให้ (0/1 = เซลล์ B แดง: ระบบไม่จัดอัตโนมัติ ครูเลือกสายเอง)
   แถวคัดเลือก:   0-17 เหมือนกัน, 18 สถานะ, 19 ครูจัดให้ (0/1 = เซลล์ B แดง) */
var TE = (function () {
  'use strict';
  var PEND = 'รอพิจารณา', TEACH = 'ครูจัดให้', UNDO_MAX = 5;

  function str(v) { return String(v == null ? '' : v).trim(); }
  function num(v) { return parseFloat(v) || 0; }
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function fail(m) { var e = new Error(m); e.user = true; throw e; }
  function byKeys(keys) {
    return function (a, b) { for (var i = 0; i < keys.length; i++) { var d = num(b[keys[i]]) - num(a[keys[i]]); if (d) return d; } return 0; };
  }
  function cloneRows(rows) { return rows.map(function (r) { return r.slice(); }); }
  function isPend(r) { return str(r[18]) === PEND; }
  function name(r) { return str(r[2]) + str(r[3]) + ' ' + str(r[4]); }

  function counts(rows, cfg) {
    var c = {};
    cfg.streams.forEach(function (s) { c[s] = 0; });
    (rows || []).forEach(function (r) { var v = str(r[18]); if (has(c, v)) c[v]++; });
    return c;
  }
  function full(list, c, q) { return list.every(function (s) { return c[s] >= q[s]; }); }

  /* ---------- คัดเลือกผู้เข้าสอบ (เหมือน sortCandidates_M4 + runSelection_M4) ---------- */
  function norm(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
  // กลุ่มสำหรับเรียง/ส่ง: B แดง → R, ม.3 เดิม+ทั่วไป → A, ทั่วไป+ความสามารถพิเศษ → B, อื่นๆ → C (เทียบตรงตัวแบบเมนูเดิม)
  function grp(r, cfg) {
    if (r[19]) return 'R';
    var f = str(r[5]), g = str(r[6]);
    if (f === cfg.m3 && g === cfg.tg) return 'A';
    if (f === cfg.tg && g === cfg.ts) return 'B';
    return 'C';
  }
  function known(r, cfg) { // ประเภทสะกดตรงแบบ (ใช้เตือนครู)
    var f = str(r[5]), g = str(r[6]);
    return (f === cfg.m3 && g === cfg.tg) || (f === cfg.tg && (g === cfg.tg || g === cfg.ts));
  }
  function byGroup(rows, cfg) {
    var G = { A: [], B: [], R: [], C: [] }, k = byKeys(cfg.selKeys);
    rows.forEach(function (r) { G[grp(r, cfg)].push(r); });
    return G.A.sort(k).concat(G.B.sort(k), G.R.sort(k), G.C.sort(k));
  }
  function selSort(rows, cfg) {
    var out = byGroup(rows, cfg);
    out.forEach(function (r, i) { r[0] = i + 1; });
    return out;
  }
  // ชนิดตอนคัดเลือก (เหมือน runSelection_M4 ซึ่งยอมรับคำที่มี "เดิม"/"พิเศษ" และเว้นวรรคเกิน): R ครูจัดให้, A ม.3 เดิม, B ทั่วไป+พิเศษ, C ทั่วไป
  function kind(r, cfg) {
    if (r[19]) return 'R';

  var M = D.main, cnt = counts(); if (!F3) F3 = CFG.streams[0];
  var rows = M.filter(function (r) { return S(r) === F3; }).sort(byOrder);
  var r1 = function (s) { var g = M.filter(function (r) { return S(r) === s; }); return g.length ? Math.round(g.filter(function (r) { return str(r[19]) === 'อันดับ 1'; }).length / g.length * 100) + '%' : '-'; };
  var tot = 0, totQ = 0; CFG.streams.forEach(function (s) { tot += cnt[s]; totQ += D.q[s]; });
  var busy = Q.some(function (x) { return x.a === 'refreshTabs'; });
  MOUNT = '';
  mount('<section class="card"><h2>ขั้นที่ 3 · ผลรายสาย</h2><table><tr><th>สายการเรียน</th><th>จัดแล้ว</th><th>โควต้า</th><th>ว่าง</th><th>ได้อันดับ 1</th></tr>' +
    CFG.streams.map(function (s) { return '<tr><td>' + chip(s) + '</td><td>' + cnt[s] + '</td><td>' + D.q[s] + '</td><td>' + (D.q[s] - cnt[s]) + '</td><td>' + r1(s) + '</td></tr>'; }).join('') +
    '<tr><th>รวม</th><th>' + tot + '</th><th>' + totQ + '</th><th>' + (totQ - tot) + '</th><th></th></tr></table>' +
    '<div class="tools"><button class="pri" data-do="refresh"' + (busy ? ' disabled' : '') + '>อัปเดตแท็บรายสายและสรุปในชีต</button>' +
    (busy ? '<span class="badge b-pend">กำลังอัปเดตแท็บในชีต…</span>' : D.dirty ? '<span class="badge b-pend">แท็บในชีตยังไม่ใช่ผลล่าสุด</span>' : '<span class="muted">แท็บในชีตเป็นผลล่าสุดแล้ว</span>') + '</div></section>' +
    '<section class="card"><div class="tabs fil sticky">' + CFG.streams.map(function (s) { var c = col(s); return '<button data-s3="' + esc(s) + '" style="' + (s === F3 ? 'background:' + c.d + ';color:#fff;border-color:' + c.d : 'color:' + c.d) + '">' + esc(s) + ' (' + cnt[s] + ')</button>'; }).join('') + '</div>' +
    '<div class="tools"><b>' + esc(F3) + '</b><span class="muted">' + rows.length + ' / ' + D.q[F3] + ' คน</span><button data-do="csvStream" style="margin-left:auto">ดาวน์โหลด CSV</button></div>' +
    '<div class="list">' + (rows.map(function (r, i) { return '<div class="it"><span class="no">' + (i + 1) + '</span><span class="nm"><b>' + nm(r) + '</b><span>' + esc(r[1]) + ' · ' + ty(r) + '</span></span><span class="pf">' + chips(r, S(r)) + '</span><span class="st"><b>' + esc(r[19]) + '</b><small>' + sc(r) + '</small></span></div>'; }).join('') || '<div class="empty">ยังไม่มีนักเรียนในสายนี้</div>') + '</div></section>');
}

/* ---------- ประวัติ / ตั้งค่า ---------- */
function vLog() {
  MOUNT = '';
  mount('<section class="card"><h2>ประวัติการจัด</h2><div class="muted">60 รายการล่าสุด (ครบทุกรายการอยู่ในแท็บ "ประวัติการจัด")</div>' +
    (LOG == null ? '<div class="row"><div class="spin"></div> กำลังโหลด…</div>' :
      '<table class="log"><tr><th>เวลา</th><th>การทำงาน</th><th>รายละเอียด</th><th class="hide-m">จำนวน</th></tr>' + (LOG.map(function (r) { return '<tr><td style="white-space:nowrap">' + esc(r[0]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td class="hide-m">' + esc(r[4]) + '</td></tr>'; }).join('') || '<tr><td colspan="4" class="empty">ยังไม่มีประวัติ</td></tr>') + '</table>') +
    '</section>');
}
function vSet() {
  var cnt = counts(), tot = 0; CFG.streams.forEach(function (s) { tot += cnt[s]; });
  MOUNT = '';
  mount('<section class="card"><h2>ตั้งค่าโควต้ารายสาย</h2><div class="muted">ใช้ทั้งหน้าเว็บและเมนูในชีต · ตั้งต่ำกว่าจำนวนที่จัดไปแล้วไม่ได้</div>' +
    '<table><tr><th>สาย</th><th>โควต้า</th><th>จัดแล้ว</th></tr>' + CFG.streams.map(function (s) { return '<tr><td>' + chip(s) + (CFG.sci.indexOf(s) >= 0 ? ' <small class="muted">วิทย์</small>' : '') + '</td><td><input type="number" min="1" data-q="' + esc(s) + '" value="' + D.q[s] + '" style="width:6em"></td><td>' + cnt[s] + '</td></tr>'; }).join('') +
    '<tr><th>รวม</th><th id="qsum"></th><th>' + tot + '</th></tr></table><div class="muted" id="qchk"></div><div><button class="pri" data-do="quotas">บันทึกโควต้า</button></div></section>' +
    (GAS ? '' : '<section class="card"><h2>การเข้าใช้งาน</h2><div class="muted">ข้อมูลเก็บไว้เฉพาะในแท็บนี้ ปิดแท็บหรือออกจากระบบแล้วหายไป</div><div><button data-do="logout">ออกจากระบบ</button></div></section>'));
  qsum();
}
function qsum() {
  var t = 0; document.querySelectorAll('[data-q]').forEach(function (e) { t += +e.value || 0; });
  $('qsum').textContent = t;
  $('qchk').textContent = D.qSel && t !== D.qSel ? '⚠ รวมโควต้ารายสาย (' + t + ') ไม่เท่ากับโควต้าตัวจริงทั้งหมด (' + D.qSel + ')' : '';
}

/* ---------- เข้าสู่ระบบ ---------- */
function showLogin(msg) {
  READY = READY && PAUSED;
  $('nav').classList.add('hide'); MOUNT = 'login';
  $('view').innerHTML = '<section class="card login"><h2>เข้าสู่ระบบ</h2><div class="muted">สำหรับหัวหน้างานรับนักเรียน · ข้อมูลนักเรียนไม่ได้เก็บไว้ในหน้าเว็บนี้</div>' +
    '<form class="row" id="lf"><input type="text" name="username" value="admission-m4" autocomplete="username" class="hide"><input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" required><button class="pri" id="bpw">เข้าสู่ระบบ</button></form>' +
    '<div class="err" id="lerr">' + esc(msg || '') + '</div>' +
    (GAS ? '' : '<details id="apd"' + (API ? '' : ' open') + '><summary>ตั้งค่าลิงก์เซิร์ฟเวอร์' + (API ? ' (ถ้าเชื่อมต่อไม่ได้)' : ' — ยังไม่ได้ตั้ง') + '</summary><div class="row" style="margin-top:8px"><input id="api" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(API) + '"><button type="button" id="bapi">บันทึกลิงก์</button></div><div class="muted">วางลิงก์ที่ลงท้ายด้วย /exec จาก Apps Script → Deploy → Manage deployments (บันทึกไว้ในเบราว์เซอร์นี้)</div></details>') +
    '</section>';
  setTimeout(function () { var p = $(API || GAS ? 'pw' : 'api'); if (p) p.focus(); }, 50);
}
function login(pw) {
  $('bpw').disabled = true; $('lerr').textContent = 'กำลังเข้าสู่ระบบ…';
  send({ a: 'login', pw: pw }).then(function (r) {
    if (!r.ok) { $('bpw').disabled = false; $('lerr').textContent = r.error || 'เข้าสู่ระบบไม่ได้'; return; }
    TOKEN = r.token; SS.set('tok', TOKEN);
    if (PAUSED && Q.length) { PAUSED = false; start(); pump(); } // ทำรายการที่ค้างต่อ
    else { PAUSED = false; Q = []; adopt(r.state); start(); persist(); }
  }, function (e) { $('bpw').disabled = false; $('lerr').textContent = e.noapi ? e.message : 'เซิร์ฟเวอร์ไม่ตอบ — ตรวจอินเทอร์เน็ต แล้วกดเข้าสู่ระบบอีกครั้ง'; if (e.noapi && $('apd')) $('apd').open = true; });
}
function start() {
  READY = true;
  if (V === 'login' || !V) V = 'asg';
  if (!D.main.length && V === 'asg') V = 'sel';
  MOUNT = ''; render(); status();
}

/* ---------- เหตุการณ์ (ผูกครั้งเดียว) ---------- */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button,[data-id],[data-sid]'); if (!t || t.disabled) return;
  var ds = t.dataset;
  if (ds.v && t.closest('#nav')) { V = ds.v; SS.set('v', V); MOUNT = ''; if (V === 'log') { LOG = null; readLog(); } render(); scrollTo(0, 0); return; }
  if (t.id === 'totop') { scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (t.id === 'bapi') { var u = $('api').value.trim(); if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)) { $('lerr').textContent = 'ลิงก์ต้องขึ้นต้นด้วย https://script.google.com และลงท้ายด้วย /exec'; return; } API = u; LS.set('api', u); $('lerr').textContent = 'บันทึกลิงก์แล้ว ใส่รหัสผ่านแล้วกดเข้าสู่ระบบได้เลย'; $('apd').open = false; $('pw').focus(); return; }
  if (ds.f1) { F1[ds.f1] = ds.v; vSel(); return; }
  if (ds.f2 != null) { F2.f = ds.f2; vAsg(); return; }
  if (ds.s3) { F3 = ds.s3; vRes(); return; }
  if (ds.put) { act('setStream', { id: ds.id, stream: ds.put }, 'บันทึกสาย'); return; }
  if (ds.open) { edit(ds.open); return; }
  if (ds.sid) { selDlg(ds.sid); return; }
  if (t.classList.contains('it') && ds.id) { edit(ds.id); return; }
  var L = CFG && CFG.stl;
  switch (ds.do) {
    case 'select': {
      var qt = $('qsel').value, has = D.sel.some(function (r) { return S(r); });
      if (has && !confirm('คัดเลือกใหม่ด้วยโควต้าตัวจริงทั้งหมด ' + qt + ' คน ?\n(ยังไม่กระทบรายชื่อหลัก จนกว่าจะกดส่งตัวจริง)')) return;
      act('select', { quota: qt }, 'บันทึกผลคัดเลือก'); return;
    }
    case 'send': {
      var assigned = D.main.filter(function (r) { return S(r); }).length;
      if (assigned && !confirm('รายชื่อหลักจัดสายไปแล้ว ' + assigned + ' คน\nส่งใหม่จะล้างผลจัดสายทั้งหมดแล้วเริ่มใหม่ ต้องการส่งหรือไม่?')) return;
      if (!assigned && D.main.length && !confirm('แทนที่รายชื่อหลักเดิม ' + D.main.length + ' คน?')) return;
      if (act('send', {}, 'ส่งตัวจริงไปรายชื่อหลัก')) { V = 'asg'; SS.set('v', V); MOUNT = ''; render(); scrollTo(0, 0); }
      return;
    }
    case 'reserveTab': act('reserveTab', {}, 'สร้างแท็บรายชื่อสำรอง'); return;
    case 'csvRsrv': {
      var rs = D.sel.filter(function (r) { return S(r) === L[2]; });
      csv('รายชื่อสำรอง ม.4', ['ลำดับสำรอง', 'เลขที่สมัคร', 'คำนำหน้า', 'ชื่อ', 'นามสกุล', 'ประเภท F', 'ประเภท G', 'อันดับที่ 1', 'อันดับที่ 2', 'อันดับที่ 3', 'อันดับที่ 4', 'S1', 'S2', 'S3', 'S4', 'S5', 'รวม', 'T-Score'], rs.map(function (r, i) { return [i + 1].concat(r.slice(1, 18)); }));
      return;
    }
    case 'sci': act('assignSci', {}, 'บันทึกการจัดสายวิทย์'); return;
    case 'art': act('assignArt', {}, 'บันทึกการจัดสายศิลป์'); return;
    case 'undo': if (confirm('ย้อนกลับ "' + D.ul + '" ?')) act('undo', {}, 'บันทึกการย้อนกลับ'); return;
    case 'clear': { var nmx = { sci: 'สายวิทย์', art: 'สายศิลป์', all: 'ทั้งหมด' }[ds.w]; if (confirm('ล้างการจัด' + nmx + ' ?\n(กดย้อนกลับได้ภายหลัง)')) act('clear', { which: ds.w }, 'บันทึกการล้าง'); return; }
    case 'refresh': act('refreshTabs', {}, 'กำลังอัปเดตแท็บในชีต'); return;
    case 'csvStream': {
      var rows = D.main.filter(function (r) { return S(r) === F3; }).sort(byOrder);
      csv('สาย ' + F3 + ' ม.4', ['ลำดับ', 'เลขที่สมัครสอบ', 'คำนำหน้า', 'ชื่อ', 'นามสกุล', 'ประเภท F', 'ประเภท G', 'อันดับที่ 1', 'อันดับที่ 2', 'อันดับที่ 3', 'อันดับที่ 4', 'S1', 'S2', 'S3', 'S4', 'S5', 'รวม', 'T-Score', 'สายที่จัดให้', 'การเลือก', 'คนที่'], rows.map(function (r, i) { return [i + 1].concat(r.slice(1, 21)); }));
      return;
    }
    case 'quotas': { var q = {}; document.querySelectorAll('[data-q]').forEach(function (e) { q[e.dataset.q] = e.value; }); act('quotas', { q: q }, 'บันทึกโควต้า'); return; }
    case 'logout': {
      if (Q.length && !confirm('ยังมีรายการที่กำลังบันทึก ถ้าออกตอนนี้รายการเหล่านั้นจะหายไป ต้องการออกหรือไม่?')) return;
      send({ a: 'logout', token: TOKEN }).catch(function () {});
      TOKEN = ''; Q = []; D = BASE = null; LOG = null; READY = false; SS.del('tok'); SS.del('st'); SS.del('v'); showLogin('ออกจากระบบแล้ว'); status(); return;
    }
  }
});
document.addEventListener('submit', function (ev) { if (ev.target.id === 'lf') { ev.preventDefault(); login($('pw').value); } });
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'q1') { F1.q = t.value.trim(); clearTimeout(listSel.t); listSel.t = setTimeout(listSel, 120); }
  else if (t.id === 'q2') { F2.q = t.value.trim(); clearTimeout(listAsg.t); listAsg.t = setTimeout(listAsg, 120); }
  else if (t.dataset && t.dataset.q) qsum();
});
$('dlg').addEventListener('click', function (ev) {
  var d = $('dlg'), t = ev.target;
  if (t === d || t.closest('[data-x]')) { d.close(); return; }
  var b = t.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.s) { d.close(); act('setStream', { id: d.dataset.id, stream: b.dataset.s }, 'บันทึกสาย'); }
  else if (b.dataset.clr) { d.close(); act('setStream', { id: d.dataset.id, stream: '' }, 'บันทึกการล้าง'); }
});
$('dlg').addEventListener('change', function (ev) {
  var d = $('dlg');
  if (ev.target.id === 'dpk') { d.close(); act('pick', { id: d.dataset.id, on: ev.target.checked }, 'บันทึกเครื่องหมาย'); }
  else if (ev.target.id === 'dsp') { d.close(); act('selPick', { id: d.dataset.id, on: ev.target.checked }, 'บันทึกครูจัดให้'); }
});
addEventListener('resize', hh);
addEventListener('scroll', function () { $('totop').style.display = scrollY > 600 && READY ? 'block' : 'none'; }, { passive: true });
addEventListener('beforeunload', function (e) { persist(true); if (Q.some(function (x) { return !x.read; })) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('pagehide', function () { persist(true); });
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && READY && Date.now() - LAST > 60000) { if (Q.length) pump(); else check(); } });
addEventListener('online', function () { if (Q.length) pump(); });

window.__m4 = { q: function () { return Q.length; }, off: function () { return OFF; }, paused: function () { return PAUSED; }, state: function () { return D; }, cfg: function () { return CFG; } }; // สำหรับตรวจสอบระบบ
/* ---------- เริ่มต้น ---------- */
(function boot() {
  if (window.__BOOT__) { adopt(window.__BOOT__); start(); persist(); return; } // เปิดผ่าน /exec ในบัญชีเจ้าของ: มีข้อมูลมากับหน้าเว็บแล้ว
  var saved = SS.get('st');
  if (saved && saved.base && saved.cfg && (TOKEN || GAS)) { // โหลดซ้ำ/กลับมาที่แท็บ: ขึ้นทันทีจากข้อมูลล่าสุด
    CFG = saved.cfg; BASE = D = fromServer(saved.base);
    (saved.q || []).some(function (x) {
      if (x.a === 'log') return false;
      try { var res = TE.run(D, { a: x.a, p: x.p }, CFG, envOf(D)), st = res.st; st.undo = nextUndo(D, res); x.after = st; D = st; Q.push(x); return false; }
      catch (e) { return true; }
    });
    start(); pump(); if (!Q.length) setTimeout(check, 300);
    return;
  }
  if (GAS || TOKEN) {
    send({ a: 'load', token: TOKEN }).then(function (r) { if (r.ok) { adopt(r.state); start(); persist(); } else showLogin(r.code === 'AUTH' ? '' : r.error); }, function (e) { showLogin(e.message); });
    return;
  }
  showLogin('');
  if (!API) return;
  send({ a: 'ping' }).then(function (r) { if (!r || !r.ok) throw 0; }).catch(function () { var l = $('lerr'); if (l && !l.textContent) l.textContent = 'ยังเชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจอินเทอร์เน็ต หรือตั้งค่าลิงก์เซิร์ฟเวอร์ด้านล่าง'; if ($('apd')) $('apd').open = true; });
})();
})();
</script></body></html>
